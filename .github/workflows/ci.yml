name: Baseline Quality Gates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  baseline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover tests -v
